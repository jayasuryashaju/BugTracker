databases:
  - name: bugtracker-db
    databaseName: bugtracker
    user: bugtracker_user
    plan: free

services:
  - type: web
    name: bugtracker-backend
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "daphne bug_tracker_backend.asgi:application --port $PORT --bind 0.0.0.0"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bugtracker-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://bugtracker-frontend.onrender.com"
      - key: IS_RENDER
        value: "True"

  - type: web
    name: bugtracker-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20.x

  - type: web
    name: bugtracker-landing
    env: static
    rootDir: landing
    buildCommand: ""
    staticPublishPath: .
