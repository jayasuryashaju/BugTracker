services:
  - type: web
    name: bugtracker-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "daphne bug_tracker_backend.asgi:application --port $PORT --bind 0.0.0.0"
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://bugtracker-frontend.onrender.com"
      - key: IS_RENDER
        value: "True"

  - type: web
    name: bugtracker-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20.x

  - type: web
    name: bugtracker-landing
    env: static
    rootDir: landing
    buildCommand: ""
    staticPublishPath: .
